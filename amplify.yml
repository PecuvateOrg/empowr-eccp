version: 1
applications:
  - appRoot: src
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - corepack enable
            - pnpm install --frozen-lockfile
        build:
          commands:
            # Amplify passes the app's SSM SecureStrings to the build only, as the
            # JSON env var `secrets`; Next reads server env from .env.production at
            # runtime. ECCP_INLINE_ISSUANCE=1 issues certificates in the request
            # (no background functions on Amplify). Key names logged, never values.
            - node -e 'const s=JSON.parse(process.env.secrets||"{}");s.ECCP_INLINE_ISSUANCE="1";require("fs").writeFileSync(".env.production",Object.entries(s).map(([k,v])=>k+"="+v).join("\n")+"\n",{mode:0o600});console.log("runtime env keys:",Object.keys(s).join(", "))'
            - mkdir -p public
            - node -e 'const fs=require("fs");const sha=process.env.AWS_COMMIT_ID||"unknown";fs.writeFileSync("public/deployment.json",JSON.stringify({commit:sha})+"\n")'
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
